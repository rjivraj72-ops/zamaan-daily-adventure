name: Rotate question bank

# Runs on the 1st and 15th of every month and can also be started by hand from
# the Actions tab. It never publishes directly: it opens a Pull Request with a
# new question-bank.json, and nothing reaches Zamaan until you merge it.
on:
  schedule:
    - cron: '0 13 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new question set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-questions.mjs

      - name: Open Pull Request for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Rotate question bank: new practice set"
          branch: rotate-questions/${{ github.run_number }}
          title: "New question set ready for review"
          body: |
            A new practice set was generated for Zamaan's Daily Adventure.

            **Before merging:** open the Files changed tab, skim `question-bank.json`,
            and check names, places and wording look right.

            **If it doesn't look good:** close this PR without merging. The app keeps
            using the current question-bank.json, so nothing changes for Zamaan.
          labels: |
            question-rotation
          reviewers: rjivraj72-ops
          assignees: rjivraj72-ops
